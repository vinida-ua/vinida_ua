<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Меблів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">MEBLI Catalog</div>
    </header>

    <section class="hero-carousel">
        <div class="carousel-track">
            <div class="slide active" style="background-image: url(Kyxha-karysel.png);"></div>
            <div class="slide" style="background-image: url(Lishko-karysel.png);"></div>
            <div class="slide" style="background-image: url(Shafa-karysel.png);"></div>
        </div>
        <button class="carousel-btn prev">&#10094;</button>
        <button class="carousel-btn next">&#10095;</button>
    </section>

    <main class="container">
        <h2 class="section-title">Категорії товарів</h2>
        <div class="categories-grid">
            
            <div class="category-card">
                <h3>Комоди</h3>
                <ul>
                    <li><a href="category.html?type=komody-vsi">Всі комоди</a></li>
                    <li><a href="category.html?type=komody-dveri">Комоди з дверцятами</a></li>
                </ul>
            </div>

            <div class="category-card">
                <h3>Шафи</h3>
                <ul>
                    <li><a href="category.html?type=shafy-standart">Звичайні шафи</a></li>
                    <li><a href="category.html?type=shafy-kupe">Шафи-купе</a></li>
                </ul>
            </div>

            <div class="category-card">
                <h3>Кухні</h3>
                <ul>
                    <li><a href="category.html?type=kuhni-vsi">Кухні</a></li>
                    <li><a href="category.html?type=kuhni-tumby">Кухонні тумби</a></li>
                </ul>
            </div>

            <div class="category-card single-link"><a href="category.html?type=lizhka">Ліжка</a></div>
            <div class="category-card single-link"><a href="category.html?type=stoly">Столи</a></div>
            <div class="category-card single-link"><a href="category.html?type=pryhozhi">Прихожі</a></div>
            <div class="category-card single-link"><a href="category.html?type=vishalky">Вішалки</a></div>
            <div class="category-card single-link"><a href="category.html?type=obuvnyci">Обувниці</a></div>
            <div class="category-card single-link"><a href="category.html?type=polyci">Полиці</a></div>
            <div class="category-card single-link"><a href="category.html?type=tumby-tv">Тумби TV</a></div>
            <div class="category-card single-link"><a href="category.html?type=rizne">Різне</a></div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
